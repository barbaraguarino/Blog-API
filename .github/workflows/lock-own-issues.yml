# Trava automaticamente as issues abertas pela dona do repositório,
# para que sirvam de planejamento sem receber comentários de terceiros.
# Usa apenas o `gh` que já vem nos runners do GitHub (nenhuma action de terceiros).
name: Travar issues próprias

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  lock:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Travar a issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue lock "$ISSUE_NUMBER"
